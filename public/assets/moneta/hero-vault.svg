<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" fill="none">
<style>
.deposit-coin { transform-box: fill-box; transform-origin: center; animation: coin-deposit 6s infinite; }
.avatar-arm { transform-origin: 538px 104px; animation: avatar-deposit 6s infinite; }
.avatar-head { transform-origin: 550px 71px; animation: avatar-look 6s infinite; }
.deposit-response { transform-box: fill-box; transform-origin: center; animation: deposit-response 6s infinite; }
@keyframes coin-deposit {
  0%, 9% { opacity: 1; transform: translate(26px, -57px) rotate(35deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  26%, 30% { opacity: 1; transform: translate(0, -8px) rotate(0deg); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
  45%, 85% { opacity: 1; transform: translate(0, 86px) rotate(0deg); }
  86%, 99% { opacity: 0; transform: translate(26px, -57px) rotate(35deg); }
  100% { opacity: 1; transform: translate(26px, -57px) rotate(35deg); }
}
@keyframes avatar-deposit {
  0%, 9% { transform: rotate(35deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  26%, 35% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  55%, 100% { transform: rotate(35deg); }
}
@keyframes avatar-look {
  0%, 12%, 65%, 100% { transform: rotate(0deg); }
  28%, 45% { transform: rotate(-8deg); }
}
@keyframes deposit-response {
  0%, 39% { opacity: 0; transform: scale(.75); }
  45% { opacity: .55; transform: scale(1); }
  56%, 100% { opacity: 0; transform: scale(1.4); }
}
@media (prefers-reduced-motion: reduce) { .deposit-coin, .deposit-response { animation: none; opacity: 0; } .avatar-arm, .avatar-head { animation: none; } }
</style>
<defs>
  <clipPath id="deposit-slot"><path d="M380 0h115v144H380Z"/></clipPath>
  <linearGradient id="shell" x1="321" y1="158" x2="598" y2="472" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".52" stop-color="#f1f7f2"/><stop offset="1" stop-color="#ceded3"/></linearGradient>
  <linearGradient id="side" x1="255" y1="189" x2="320" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#dbe9df"/><stop offset="1" stop-color="#aac4b4"/></linearGradient>
  <linearGradient id="rim" x1="354" y1="236" x2="571" y2="438" gradientUnits="userSpaceOnUse"><stop stop-color="#d4e5da"/><stop offset=".45" stop-color="#9bb8a7"/><stop offset=".75" stop-color="#f7fcf8"/><stop offset="1" stop-color="#9bb7a7"/></linearGradient>
  <linearGradient id="door" x1="380" y1="250" x2="540" y2="422" gradientUnits="userSpaceOnUse"><stop stop-color="#298d72"/><stop offset=".5" stop-color="#14735b"/><stop offset="1" stop-color="#103e32"/></linearGradient>
  <linearGradient id="steel" x1="428" y1="290" x2="495" y2="374" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".3" stop-color="#d5e1d9"/><stop offset=".5" stop-color="#9eb5a7"/><stop offset=".68" stop-color="#edf5ee"/><stop offset="1" stop-color="#91a99a"/></linearGradient>
  <linearGradient id="card" x1="142" y1="320" x2="341" y2="478" gradientUnits="userSpaceOnUse"><stop stop-color="#1c725c"/><stop offset="1" stop-color="#102c28"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ebc6"/><stop offset=".5" stop-color="#d5c38b"/><stop offset="1" stop-color="#ad965d"/></linearGradient>
  <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(398 264) rotate(45) scale(212)"><stop stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="ground" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="contact" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="3" dy="12" stdDeviation="9" flood-color="#173f2d" flood-opacity=".15"/></filter>
</defs>
<!-- One lighting direction and a transparent ground. -->
<ellipse cx="401" cy="508" rx="222" ry="22" fill="#234c37" opacity=".1" filter="url(#ground)"/>
<ellipse cx="449" cy="486" rx="142" ry="11" fill="#234c37" opacity=".14" filter="url(#contact)"/>
<!-- Restrained growth columns, behind the vault. -->
<g stroke="#f5faf6" stroke-width="1.5" stroke-linejoin="round">
 <path d="m126 346 44-22 42 22v116l-44 22-42-22Z" fill="#dbe9df"/><path d="m126 346 42 21 44-21-42-22Z" fill="#edf5ef"/>
 <path d="m184 284 44-22 42 22v151l-44 22-42-22Z" fill="#bad1c2"/><path d="m184 284 42 21 44-21-42-22Z" fill="#d8e8dd"/>
 <path d="m242 215 44-22 42 22v188l-44 22-42-22Z" fill="#6f9e86"/><path d="m242 215 42 21 44-21-42-22Z" fill="#a2c4af"/>
</g>
<!-- Solid chassis with a consistent shallow three-quarter perspective. -->
<path d="M286 135c-22 0-38 17-38 39v246c0 17 8 31 23 39l58 29V179l-34-44Z" fill="url(#side)"/>
<path d="m272 143 55 30h235l29-16-52-28c-9-5-18-7-28-7H294c-9 0-16 8-22 21Z" fill="#f9fcf9"/>
<rect x="310" y="153" width="292" height="335" rx="42" fill="url(#shell)" stroke="#fff" stroke-width="2"/>
<rect x="320" y="163" width="272" height="315" rx="34" stroke="#fff" stroke-opacity=".6"/>
<path d="M264 187v227c0 11 4 20 12 25" stroke="#e9f3ec" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
<!-- A seated saver reaches over the slot, releases the coin, and draws their arm back. -->
<g class="saver-avatar">
  <ellipse cx="551" cy="147" rx="29" ry="5" fill="#294b38" opacity=".12"/>
  <!-- Legs drape over the edge of the vault. -->
  <path d="M539 137q16 2 38 14l-5 40" stroke="#243f35" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M555 138q20 5 34 20l-1 42" stroke="#365b47" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m565 188 3 10 14 1" stroke="#f0f5ee" stroke-width="10" stroke-linecap="round"/>
  <path d="m583 198 1 9 15 2" stroke="#f0f5ee" stroke-width="10" stroke-linecap="round"/>
  <!-- A lavender overshirt ties the character to the card accent. -->
  <path d="M538 81q15-7 26 5l9 45q2 14-13 17l-26-4q-10-2-8-15Z" fill="#b8a5d0"/>
  <path d="m558 94 15 25-12 18" stroke="#aa95c3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="559" cy="139" r="7" fill="#c98f68"/>
  <path d="m546 75-1 12" stroke="#c98f68" stroke-width="12" stroke-linecap="round"/>
  <g class="avatar-head">
    <path d="M527 45q0-21 23-21 24 1 22 25l-7 12-34-4Z" fill="#213c31"/>
    <path d="M531 44q3 6 5 6l2-12q16 7 26 0l-2 27q-5 15-18 10-15-4-14-21Z" fill="#dea57b"/>
    <circle cx="563" cy="52" r="5" fill="#dea57b"/>
    <path d="m534 56 4 1m10-1 4-1" stroke="#294235" stroke-width="2" stroke-linecap="round"/>
    <path d="m538 67 8 1" stroke="#a5694d" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g class="avatar-arm">
    <path d="M538 104 501 91" stroke="#b8a5d0" stroke-width="17" stroke-linecap="round"/>
    <path d="M502 91h-43" stroke="#dea57b" stroke-width="11" stroke-linecap="round"/>
    <path d="m460 91-7-5m7 5-8 3" stroke="#dea57b" stroke-width="6" stroke-linecap="round"/>
  </g>
</g>
<!-- The coin shares the vault coordinate system and disappears behind the slot. -->
<g clip-path="url(#deposit-slot)">
 <g class="deposit-coin">
  <ellipse cx="439" cy="93" rx="24" ry="29" fill="#a48e58"/>
  <ellipse cx="435" cy="91" rx="24" ry="29" fill="url(#gold)" stroke="#faf1d2" stroke-width="2"/>
  <ellipse cx="435" cy="91" rx="19" ry="24" stroke="#bba773"/>
  <path d="M428 99V82l7 8 7-8v17" stroke="#a38d56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</g>
<!-- Discrete coin slot, recessed in the top face. -->
<path d="m381 139 92 0 15 8h-92Z" fill="#adc4b5"/>
<path d="M396 144h76" stroke="#183d2e" stroke-width="4" stroke-linecap="round"/>
<ellipse class="deposit-response" cx="435" cy="144" rx="43" ry="7" stroke="#5aab86" stroke-width="2" opacity="0"/>
<!-- Small branded wordmark. -->
<g stroke="#45735a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M347 196v-10l6 7 6-7v10"/><path d="M371 191h37" stroke-width="1.5" opacity=".45"/></g>
<!-- Machined door rim and bevel. -->
<circle cx="456" cy="333" r="113" fill="#b2cabc"/>
<circle cx="456" cy="330" r="111" fill="url(#rim)"/>
<circle cx="456" cy="330" r="102" fill="url(#door)" stroke="#e1eee5" stroke-width="1.5"/>
<circle cx="456" cy="330" r="92" stroke="#82b49a" stroke-opacity=".45"/>
<circle cx="456" cy="330" r="87" stroke="#0b4635" stroke-opacity=".4"/>
<circle cx="456" cy="330" r="101" fill="url(#shine)"/>
<!-- Hinges align with the edge of the door. -->
<g fill="url(#steel)" stroke="#aec4b6"><rect x="565" y="251" width="19" height="42" rx="7"/><rect x="565" y="369" width="19" height="42" rx="7"/></g>
<!-- Dial, calibrated ticks, and a three-spoke handle. -->
<circle cx="456" cy="330" r="43" fill="#0c4635" opacity=".4" transform="translate(2 4)"/>
<circle cx="456" cy="330" r="42" fill="url(#steel)" stroke="#f4faf5" stroke-width="2"/>
<circle cx="456" cy="330" r="34" stroke="#577862" stroke-width="4" stroke-dasharray="1 6.1"/>
<circle cx="456" cy="330" r="26" fill="url(#steel)" stroke="#abc1b2"/>
<g stroke="#718f7d" stroke-width="10" stroke-linecap="round"><path d="m456 330-22-27m22 27 30-8m-30 8-8 31"/></g>
<g stroke="url(#steel)" stroke-width="7" stroke-linecap="round"><path d="m455 328-22-27m22 27 30-8m-30 8-8 31"/></g>
<circle cx="455" cy="328" r="9" fill="url(#steel)" stroke="#f5faf6"/>
<!-- Card: restrained face, accurate chip geometry and subtle engraved details. -->
<g transform="rotate(-12 254 409)" filter="url(#cardShadow)">
 <rect x="147" y="340" width="214" height="138" rx="17" fill="#0c3328" transform="translate(0 4)"/>
 <rect x="147" y="340" width="214" height="138" rx="17" fill="url(#card)" stroke="#4f8e73"/>
 <path d="M148 441c79 6 114-42 212-36v55c0 10-8 17-17 17H165c-10 0-17-7-17-17Z" fill="#b5d1bd"/>
 <path d="M242 478c31-29 72-43 118-45v27c0 10-8 17-17 17Z" fill="#c5b5df"/>
 <rect x="171" y="365" width="32" height="25" rx="5" fill="url(#gold)" stroke="#f2e9c8"/>
 <path d="M181 366v8l-5 4 5 4v7m11-23v8l5 4-5 4v7m-20-11h31" stroke="#a18f59" stroke-width=".8"/>
 <path d="M311 374v-12l8 8 8-8v12" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
 <g fill="#e9f3ec" opacity=".6"><circle cx="174" cy="414" r="1.5"/><circle cx="181" cy="414" r="1.5"/><circle cx="188" cy="414" r="1.5"/><circle cx="195" cy="414" r="1.5"/><rect x="208" y="413" width="25" height="2" rx="1"/></g>
</g>
<!-- Low coin stack with fine milled edges. -->
<ellipse cx="428" cy="501" rx="48" ry="9" fill="#345840" opacity=".12" filter="url(#contact)"/>
<g stroke="#e9dfb8" stroke-width="1">
 <path d="M382 474v21c0 7 20 13 45 13s45-6 45-13v-21Z" fill="#b5a16d"/>
 <path d="M382 484c0 7 20 13 45 13s45-6 45-13m-90-8c0 7 20 13 45 13s45-6 45-13"/>
 <ellipse cx="427" cy="474" rx="45" ry="13" fill="url(#gold)"/>
 <ellipse cx="427" cy="474" rx="36" ry="9" stroke="#f7efcf"/>
</g>
<g transform="rotate(18 504 482)">
 <ellipse cx="509" cy="484" rx="30" ry="38" fill="#a48e58"/>
 <ellipse cx="504" cy="482" rx="30" ry="38" fill="url(#gold)" stroke="#faf1d2" stroke-width="2"/>
 <ellipse cx="504" cy="482" rx="24" ry="31" stroke="#bba773" stroke-width="1"/>
 <path d="M497 492v-22l7 10 7-10v22" stroke="#a38d56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
